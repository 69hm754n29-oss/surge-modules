name: bilibili-auto-update
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时检查一次上游
  workflow_dispatch:
  push:
    paths: ['bilibili/build.py', 'bilibili/template_*.js']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build
        run: |
          cd bilibili
          old=$(cat upstream.lock.json 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['module'],d['kk'],d['clyde'])" || true)
          cp bilibili.sgmodule /tmp/old.sgmodule 2>/dev/null || true
          python3 build.py
          node --check bilibili.allinone.js
          node --check bilibili.skin.js
          new=$(python3 -c "import json;d=json.load(open('upstream.lock.json'));print(d['module'],d['kk'],d['clyde'])")
          if [ "$old" = "$new" ] && [ -f /tmp/old.sgmodule ]; then git checkout -- . ; echo "upstream unchanged"; fi
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A bilibili
          git diff --cached --quiet || (git commit -m "bilibili: sync upstream $(date -u +%F)" && git push)
