name: build-modules
on:
  schedule:
    - cron: '17 */6 * * *'      # 每 6 小时检查上游
  workflow_dispatch:
  push:
    paths:
      - '*/build.py'
      - '*/template_*.js'
      - '*/skeleton.sgmodule'
      - '_common.py'
      - 'build_all.sh'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build all modules
        run: |
          mkdir -p /tmp/before
          git ls-files '*.sgmodule' '*.js' | xargs -r -I{} cp --parents {} /tmp/before/ 2>/dev/null || true
          sh build_all.sh
          for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          if git diff --cached --quiet; then echo "no upstream change"; else git commit -m "modules: sync upstream $(date -u +%F)"; git push; fi
